[project]
name = "research-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0",
    "langchain-core",
    "langchain-openai",
    "langchain-tavily",
    "python-dotenv",
    "pydantic>=2",
    "streamlit>=1.65.0",
    "langgraph-checkpoint-sqlite",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]",
    "colorama",
    "pytest",
    "langsmith>=0.3",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# langsmith 내부의 Python 3.14 사용 중단 경고만 숨김 (라이브러리 쪽 문제, 동작 영향 없음)
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith.*",
]

[tool.setuptools]
packages = ["research_agent"]
