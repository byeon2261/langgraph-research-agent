[project]
name = "research-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain-core",
    "langchain-openai",
    "langchain-tavily",
    "python-dotenv",
    "pydantic>=2",
    "streamlit>=1.65.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]",
    "colorama",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["research_agent"]
